<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body class="home">
<div id="wall" class="wall w-none"></div>
<div id="tint"></div>
<div class="grain"></div>

<header class="top">
  <a href="https://mail.google.com">Gmail</a>
  <a href="https://www.google.com/imghp">Images</a>
  <a id="apps" href="https://about.google/products/" title="Google apps" aria-label="Google apps">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M5 5h3v3H5zm5.5 0h3v3h-3zM16 5h3v3h-3zM5 10.5h3v3H5zm5.5 0h3v3h-3zm5.5 0h3v3h-3zM5 16h3v3H5zm5.5 0h3v3h-3zm5.5 0h3v3h-3z"/></svg>
  </a>
  <button id="avatar" title="Jarvis settings" aria-label="Jarvis settings">J</button>
</header>

<main>
  <section class="hero">
    <canvas id="orb" title="Click to talk"></canvas>
    <h1 class="word">Jarvis</h1>
  </section>

  <div class="barwrap">
  <div id="bar">
    <button class="ib" id="newchat" title="New conversation" aria-label="New conversation">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    </button>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Ask Jarvis or type a URL">
    <button class="ib" id="mic" title="Voice" aria-label="Voice">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
    </button>
    <button id="mode" class="modechip" title="Switch between Jarvis and web search (Shift+Enter does the opposite once)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
      <span>Jarvis</span>
    </button>
  </div>
  <div id="suggest" hidden></div>
  </div>

  <div class="chips" id="chips">
    <button class="card" data-prompt="Group my open tabs by site. Don't close anything.">
      <b>Tidy my tabs</b><small>Group by site, nothing closed</small>
    </button>
    <button class="card" data-prompt="Start a 25 minute focus timer.">
      <b>Start a focus timer</b><small>25 minutes, I'll nudge you</small>
    </button>
  </div>

  <div id="log"></div>
  <nav id="shortcuts"></nav>
</main>

<footer>
  <button id="status" class="pill"></button>
  <button id="edit" title="Customize Jarvis" aria-label="Customize Jarvis">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>
  </button>
</footer>

<aside id="panel" hidden>
  <h3>Customize Jarvis</h3>
  <div class="sec">Look</div>
  <div class="row"><span>Theme</span><div id="swatches"></div></div>
  <div class="row"><span>Accent</span><input id="hue" type="range" min="0" max="360"></div>
  <div class="sec">Wallpaper</div>
  <div class="seg" id="wallSeg">
    <button data-wall="none">None</button><button data-wall="aurora">Aurora</button><button data-wall="grid">Grid</button><button data-wall="image">Photo</button>
  </div>
  <div class="row"><span>Tint</span><input id="tintR" type="range" min="0" max="90" value="40"></div>
  <div class="row"><span>Blur</span><input id="blurR" type="range" min="0" max="24" value="0"></div>
  <button id="upload" class="linkbtn">Upload a photo...</button><input id="file" type="file" accept="image/*" hidden>
  <div id="wallMsg" class="note"></div>
  <div class="sec">Shortcuts</div>
  <div class="seg" id="scSeg"><button data-sc="top">Most visited</button><button data-sc="custom">My shortcuts</button></div>
  <label class="row"><span>Show shortcuts</span><input id="optShortcuts" type="checkbox"></label>
  <div class="sec">Behavior</div>
  <label class="row" title="Sends what you type to Google to fetch suggestions"><span>Web suggestions</span><input id="optSuggest" type="checkbox"></label>
  <label class="row"><span>Speak replies</span><input id="optSpeak" type="checkbox"></label>
  <button id="fullSettings" class="linkbtn">API key, model and tools...</button>
</aside>

<div id="scMenu" hidden>
  <button data-act="edit">Edit shortcut</button>
  <button data-act="remove">Remove</button>
</div>

<dialog id="scDialog">
  <form id="scForm" method="dialog">
    <h3 id="scHead">Add shortcut</h3>
    <label>Name<input id="scName" type="text" autocomplete="off"></label>
    <label>URL<input id="scUrl" type="text" autocomplete="off" placeholder="example.com" required></label>
    <div class="acts"><button type="button" id="scCancel" class="ghost">Cancel</button><button type="submit">Done</button></div>
  </form>
</dialog>

<script src="newtab.js" type="module"></script>
</body>
</html>
